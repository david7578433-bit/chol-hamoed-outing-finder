name: Daily hours and prices check

on:
  schedule:
    # 10:00 UTC = 6 AM New York (5 AM in winter), Sunday to Friday. Skips Shabbos.
    - cron: "0 10 * * 0-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check every website
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_sites.py
      - name: Save the results to the website
        run: |
          git config user.name "daily-check"
          git config user.email "daily-check@users.noreply.github.com"
          git add data/checks.json
          git diff --cached --quiet || git commit -m "Daily hours and prices check"
          git push

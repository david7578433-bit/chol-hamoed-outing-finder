name: Keep database awake
# Free database projects pause after 7 quiet days. This touches the database once a day.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          URL="https://fefevvpcuvhjasfcuvev.supabase.co"
          KEY="sb_publishable_-Oc4z0KW57MBHh_lpig94A_-URMAeTu"   # public (publishable) key, same one the site already uses
          curl -s -o /dev/null -w "rest %{http_code}\n" "$URL/rest/v1/feedback?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          curl -s -o /dev/null -w "auth %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
